name: Docker

on:
  workflow_call:
    secrets:
      DOCKER_HUB_PASSWORD:
        required: true


jobs:
  
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: setup Docker Build
        uses: docker/setup-buildx-action@v3.11.1

    name: Docker Login
    uses: docker/login-action@v3.6.0
      with:
      username: eujuang
      password: ${{ secrets.DOCKER_HUB_PASSWORD }}

          


