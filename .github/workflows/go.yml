name: Go

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  # Testes com Postgres (services só funcionam em Linux)
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.17.x', '1.18.x']

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download deps
        run: go mod download

      - name: Run tests
        env:
          # ajuste se seu app usa outro nome de variável
          DATABASE_URL: postgres://root:root@localhost:5432/root?sslmode=disable
        run: go test -v ./...

  # Build em matriz de sistemas operacionais (sem DB)
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.18.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build -v ./...
