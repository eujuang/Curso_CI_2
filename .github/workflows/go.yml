name: Go

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

# <<< coloque o caminho onde está o go.mod >>>
defaults:
  run:
    working-directory: ./Projeto_base

jobs:
  test:
    runs-on: ubuntu-latest

    # Remova isto se não usa DB nos testes
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    strategy:
      fail-fast: false
      matrix:
        go: ['1.17.x', '1.18.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      # Só para confirmar que estamos no diretório certo
      - name: Show tree
        run: |
          pwd
          ls -la
          cat go.mod

      - name: Download deps
        run: go mod download

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb?sslmode=disable
        run: go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.18.x'
      # mesmo diretório do defaults.run
      - run: go build -v ./...
