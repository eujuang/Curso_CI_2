name: Go

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  
  test:
    runs-on: ubuntu-latest
    env:
      HOST: localhost
      PORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root
    strategy:
      fail-fast: false
      matrix:
        go: ['1.17.x', '1.18.x']

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download deps
        run: go mod download

      - name: Run tests
        env:
          DATABASE_URL: postgres://root:root@localhost:5432/root?sslmode=disable
        run: go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build -v ./...

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: programa
          path: main 

    docker:
      needs: build
      uses: ./.github/workflows/Docker.yml
      secrets: inherit
