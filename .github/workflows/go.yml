name: Go

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    strategy:
      fail-fast: false
      matrix:
        go: ['1.17.x', '1.18.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Baixar dependências
        run: go mod download

      - name: Rodar testes
        env:
          # use o mesmo DSN que seu código espera; se for diferente, ajuste o nome da variável
          DATABASE_URL: postgres://root:root@localhost:5432/root?sslmode=disable
        run: go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.18.x'
      - run: go build -v ./...
