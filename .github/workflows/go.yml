name: Go

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.17.x', '1.18.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build DB images
        run: docker compose build

      - name: Start DB
        run: docker compose up -d

      # Ajuste o nome do serviço (db) e o usuário conforme seu docker-compose.yml
      - name: Wait for DB (Postgres)
        shell: bash
        run: |
          for i in {1..60}; do
            if docker compose exec -T db pg_isready -U postgres >/dev/null 2>&1; then
              echo "DB pronto"
              exit 0
            fi
            sleep 2
          done
          echo "DB não ficou pronto"
          docker compose logs
          exit 1

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb?sslmode=disable
        run: go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.18.x'
      - run: go build -v ./...
